<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#667eea">
    <title>Muse — для творческих</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafafa;
            color: #1a1a1a;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Auth Screen */
        .auth-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .auth-box {
            background: white;
            padding: 40px 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .logo-large {
            font-size: 48px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-box h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #666;
            font-size: 16px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.2s;
            font-family: inherit;
        }

        .input-group input:focus, .input-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .auth-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }

        .auth-btn:active {
            transform: scale(0.98);
        }

        .switch-auth {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .switch-auth span {
            color: #667eea;
            font-weight: 600;
            cursor: pointer;
        }

        /* Main App */
        .app {
            display: none;
            min-height: 100vh;
        }

        .app.active {
            display: block;
        }

        /* Top Bar */
        .top-bar {
            background: white;
            padding: 12px 16px;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .top-bar h1 {
            font-size: 20px;
            font-weight: 700;
        }

        .menu-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            margin-right: 12px;
        }

        /* Mobile Sidebar (LEFT) */
        .mobile-sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 280px;
            background: white;
            box-shadow: 2px 0 20px rgba(0,0,0,0.1);
            z-index: 1000;
            padding: 20px;
            padding-top: 60px;
            transform: translateX(-100%);
            transition: transform 0.3s;
        }

        .mobile-sidebar.active {
            transform: translateX(0);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }

        .sidebar-overlay.active {
            display: block;
        }

        .close-sidebar {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }

        .sidebar-nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 4px;
            font-size: 15px;
            font-weight: 500;
        }

        .sidebar-nav-item:active {
            transform: scale(0.97);
        }

        .sidebar-nav-item:hover {
            background: #f0f0f0;
        }

        .sidebar-nav-item.active {
            background: #667eea;
            color: white;
        }

        .sidebar-nav-item svg {
            width: 20px;
            height: 20px;
        }

        /* Main Content */
        .main-content {
            padding: 20px;
            padding-bottom: 80px;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Categories */
        .categories {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .category-chip {
            padding: 8px 16px;
            border-radius: 20px;
            background: white;
            border: 1px solid #e0e0e0;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .category-chip:active {
            transform: scale(0.95);
        }

        .category-chip.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        /* Post Card */
        .post-card {
            background: white;
            border-radius: 16px;
            margin-bottom: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
        }

        .post-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            flex-shrink: 0;
        }

        .post-author-info {
            flex: 1;
        }

        .post-author-name {
            font-weight: 600;
            font-size: 14px;
        }

        .post-author-handle {
            color: #666;
            font-size: 13px;
        }

        .post-image {
            width: 100%;
            max-height: 600px;
            object-fit: cover;
        }

        .post-audio {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .audio-player {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
        }

        .play-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .post-text {
            padding: 24px;
            background: #f9f9f9;
            font-family: 'Georgia', serif;
            font-size: 16px;
            line-height: 1.8;
            color: #333;
            white-space: pre-wrap;
        }

        .post-content {
            padding: 16px;
        }

        .post-caption {
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .post-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 12px;
            color: #667eea;
            background: #f0f0ff;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 500;
        }

        .post-actions {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-top: 1px solid #f0f0f0;
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 13px;
            color: #666;
            padding: 8px 12px;
            border-radius: 8px;
            font-family: inherit;
        }

        .action-btn:active {
            transform: scale(0.92);
        }

        .action-btn.liked {
            color: #ef4444;
        }

        .action-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Comments Section */
        .comments-section {
            padding: 12px 16px;
            border-top: 1px solid #f0f0f0;
            background: #fafafa;
        }

        .comment {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            padding: 8px 0;
        }

        .comment.reply {
            margin-left: 42px;
            padding-left: 12px;
            border-left: 2px solid #e0e0e0;
        }

        .comment-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 12px;
            flex-shrink: 0;
        }

        .comment-content {
            flex: 1;
            min-width: 0;
        }

        .comment-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }

        .comment-author {
            font-weight: 600;
            font-size: 13px;
        }

        .comment-reply-to {
            font-size: 12px;
            color: #667eea;
            font-weight: 500;
        }

        .comment-text {
            font-size: 14px;
            color: #333;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .comment-image {
            max-width: 200px;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 8px;
            object-fit: cover;
            cursor: pointer;
        }

        .comment-actions {
            display: flex;
            gap: 12px;
            margin-top: 6px;
        }

        .comment-action-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 12px;
            cursor: pointer;
            padding: 2px 0;
            font-family: inherit;
        }

        .comment-action-btn:active {
            color: #667eea;
        }

        .comment-input-wrapper {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eee;
            align-items: flex-end;
        }

        .comment-input-container {
            flex: 1;
            position: relative;
        }

        .comment-input {
            width: 100%;
            padding: 10px 40px 10px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            font-size: 14px;
            font-family: inherit;
        }

        .comment-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .attach-image-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            color: #666;
        }

        .attach-image-btn:active {
            color: #667eea;
        }

        .comment-image-preview {
            display: none;
            margin-top: 8px;
            position: relative;
        }

        .comment-image-preview img {
            max-width: 100px;
            max-height: 100px;
            border-radius: 8px;
            object-fit: cover;
        }

        .remove-image-btn {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .comment-submit {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            flex-shrink: 0;
        }

        .reply-indicator {
            display: none;
            background: #f0f0ff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            color: #667eea;
            margin-bottom: 8px;
            align-items: center;
            justify-content: space-between;
        }

        .reply-indicator.active {
            display: flex;
        }

        .cancel-reply {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }

        /* Profile Page */
        .profile-header {
            background: white;
            padding: 30px 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            text-align: center;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 40px;
            font-weight: 700;
            margin: 0 auto 16px;
        }

        .profile-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .profile-handle {
            color: #666;
            margin-bottom: 20px;
        }

        .edit-profile-btn, .logout-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin: 4px;
        }

        .edit-profile-btn {
            background: #667eea;
            color: white;
        }

        .logout-btn {
            background: #f0f0f0;
            color: #333;
        }

        /* Users List */
        .user-card {
            background: white;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .user-card-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 18px;
        }

        .user-card-info {
            flex: 1;
        }

        .user-card-name {
            font-weight: 600;
            font-size: 15px;
        }

        .user-card-handle {
            color: #666;
            font-size: 13px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-header h2 {
            font-size: 20px;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }

        .post-type-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .type-btn {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
        }

        .type-btn.active {
            border-color: #667eea;
            background: #f0f0ff;
            color: #667eea;
        }

        .type-btn-icon {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .upload-area {
            border: 2px dashed #e0e0e0;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .upload-area.has-media {
            padding: 0;
            border-style: solid;
        }

        .upload-area img {
            width: 100%;
            border-radius: 10px;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .text-input {
            width: 100%;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 16px;
            font-size: 15px;
            font-family: 'Georgia', serif;
            resize: vertical;
            min-height: 200px;
            margin-bottom: 16px;
            line-height: 1.6;
        }

        .caption-input {
            width: 100%;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 16px;
            font-size: 15px;
            resize: vertical;
            min-height: 100px;
            margin-bottom: 16px;
        }

        .tags-input {
            width: 100%;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .submit-btn {
            width: 100%;
            background: #667eea;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* FAB */
        .fab {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
            z-index: 99;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .info-banner {
            background: #fff3cd;
            border: 1px solid #ffe69c;
            color: #856404;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 14px;
            line-height: 1.5;
        }

        @media (max-width: 768px) {
            .main-content {
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- Auth Screen -->
    <div class="auth-container" id="authScreen">
        <div class="auth-box">
            <div class="logo-large">Muse</div>
            <h2 id="authTitle">Создать аккаунт</h2>
            
            <div class="input-group">
                <label>Имя</label>
                <input type="text" id="regName" placeholder="Ваше имя">
            </div>
            
            <div class="input-group">
                <label>Никнейм</label>
                <input type="text" id="regUsername" placeholder="@username">
            </div>
            
            <div class="input-group">
                <label>Пароль</label>
                <input type="password" id="regPassword" placeholder="••••••••">
            </div>
            
            <button class="auth-btn" onclick="handleAuth()">Продолжить</button>
            
            <div class="switch-auth">
                <span onclick="toggleAuthMode()">Уже есть аккаунт? Войти</span>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div class="app" id="mainApp">
        <!-- Mobile Sidebar -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
        <div class="mobile-sidebar" id="mobileSidebar">
            <button class="close-sidebar" onclick="toggleSidebar()">×</button>
            <div class="logo-large" style="margin-bottom: 30px;">Muse</div>
            <div class="sidebar-nav-item active" onclick="navigate('home'); toggleSidebar();">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                <span>Лента</span>
            </div>
            <div class="sidebar-nav-item" onclick="navigate('explore'); toggleSidebar();">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <span>Обзор</span>
            </div>
            <div class="sidebar-nav-item" onclick="navigate('notifications'); toggleSidebar();">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
                <span>Уведомления</span>
            </div>
            <div class="sidebar-nav-item" onclick="navigate('profile'); toggleSidebar();">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                <span>Профиль</span>
            </div>
        </div>

        <!-- Top Bar -->
        <div class="top-bar">
            <div style="display: flex; align-items: center;">
                <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                <h1 id="pageTitle">Лента</h1>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content" id="mainContent"></div>

        <!-- FAB -->
        <button class="fab" onclick="openCreateModal()">+</button>
    </div>

    <!-- Create Post Modal -->
    <div class="modal" id="createModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Новый пост</h2>
                <button class="close-modal" onclick="closeCreateModal()">×</button>
            </div>

            <div class="post-type-selector">
                <button class="type-btn active" data-type="image" onclick="selectPostType('image')">
                    <div class="type-btn-icon">🖼️</div>
                    <div>Изображение</div>
                </button>
                <button class="type-btn" data-type="audio" onclick="selectPostType('audio')">
                    <div class="type-btn-icon">🎵</div>
                    <div>Музыка</div>
                </button>
                <button class="type-btn" data-type="text" onclick="selectPostType('text')">
                    <div class="type-btn-icon">✍️</div>
                    <div>Текст</div>
                </button>
            </div>

            <div id="upload-section">
                <div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()">
                    <div class="upload-icon"></div>
                    <div class="upload-text">Нажмите, чтобы загрузить</div>
                </div>
                <input type="file" id="file-input" accept="image/*" style="display: none" onchange="handleFileSelect(event)">
            </div>

            <div id="text-section" style="display: none;">
                <textarea class="text-input" id="text-content" placeholder="Напишите свой текст..."></textarea>
            </div>

            <textarea class="caption-input" id="caption" placeholder="Расскажите о своей работе..."></textarea>
            <input type="text" class="tags-input" id="tags" placeholder="Теги через запятую">
            <button class="submit-btn" id="submit-btn" onclick="submitPost()" disabled>Опубликовать</button>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Редактировать профиль</h2>
                <button class="close-modal" onclick="closeEditModal()">×</button>
            </div>
            <div class="input-group">
                <label>Имя</label>
                <input type="text" id="editName">
            </div>
            <div class="input-group">
                <label>Никнейм</label>
                <input type="text" id="editUsername">
            </div>
            <button class="auth-btn" onclick="saveProfile()">Сохранить</button>
        </div>
    </div>

    <script>
        let currentUser = null;
        let isLoginMode = false;
        let currentPage = 'home';
        let currentCategory = 'all';
        let currentPostType = 'image';
        let uploadedMedia = null;
        let replyTo = null;
        let commentImage = null;

        const samplePosts = [
            { id: 1, author: 'Анна К.', handle: '@anna_art', avatar: 'А', time: '2 часа назад', type: 'image', image: 'https://images.unsplash.com/photo-1541961017774-22349e4a1262?w=800', caption: 'Сегодняшняя абстракция. Играю с формами и цветом.', tags: ['живопись', 'абстракция'], category: 'art', likes: 42, liked: false, comments: [] },
            { id: 2, author: 'Максим Д.', handle: '@max_photo', avatar: 'М', time: '5 часов назад', type: 'image', image: 'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=800', caption: 'Утренний кофе и тишина.', tags: ['фото', 'утро'], category: 'photo', likes: 128, liked: false, comments: [] },
            { id: 3, author: 'Дмитрий В.', handle: '@dmitry_music', avatar: 'Д', time: '1 день назад', type: 'text', text: 'Город просыпался медленно, словно нехотя открывая глаза после долгой ночи. Туман стелился по улицам, обнимая старые фонари, которые ещё горели, несмотря на рассвет.', caption: 'Отрывок из нового рассказа.', tags: ['проза', 'город'], category: 'text', likes: 93, liked: false, comments: [] }
        ];

        window.onload = function() {
            const saved = localStorage.getItem('muse_currentUser');
            if (saved) {
                currentUser = JSON.parse(saved);
                showApp();
            }
        };

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('authTitle').textContent = isLoginMode ? 'Войти' : 'Создать аккаунт';
            document.querySelector('.switch-auth span').textContent = isLoginMode ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти';
        }

        function handleAuth() {
            const name = document.getElementById('regName').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            if (!name || !username || !password) { alert('Заполните все поля'); return; }

            if (isLoginMode) {
                const users = JSON.parse(localStorage.getItem('muse_users') || '[]');
                const user = users.find(u => u.username === username && u.password === password);
                if (user) {
                    currentUser = user;
                    localStorage.setItem('muse_currentUser', JSON.stringify(user));
                    showApp();
                } else { alert('Неверный никнейм или пароль'); }
            } else {
                const users = JSON.parse(localStorage.getItem('muse_users') || '[]');
                if (users.find(u => u.username === username)) { alert('Никнейм занят'); return; }
                const newUser = { id: Date.now(), name, username, password, avatar: name.charAt(0).toUpperCase() };
                users.push(newUser);
                localStorage.setItem('muse_users', JSON.stringify(users));
                currentUser = newUser;
                localStorage.setItem('muse_currentUser', JSON.stringify(newUser));
                showApp();
            }
        }

        function showApp() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('mainApp').classList.add('active');
            navigate('home');
        }

        function logout() {
            localStorage.removeItem('muse_currentUser');
            location.reload();
        }

        function navigate(page) {
            currentPage = page;
            document.querySelectorAll('.sidebar-nav-item').forEach((item, i) => {
                const pages = ['home', 'explore', 'notifications', 'profile'];
                item.classList.toggle('active', pages[i] === page);
            });

            const content = document.getElementById('mainContent');
            const title = document.getElementById('pageTitle');

            switch(page) {
                case 'home':
                    title.textContent = 'Лента';
                    renderFeed(content);
                    break;
                case 'explore':
                    title.textContent = 'Обзор';
                    renderExplore(content);
                    break;
                case 'notifications':
                    title.textContent = 'Уведомления';
                    content.innerHTML = '<div class="empty-state"><h2>Уведомления</h2><p>Здесь будут уведомления о лайках и комментариях</p></div>';
                    break;
                case 'profile':
                    title.textContent = 'Профиль';
                    renderProfile(content);
                    break;
            }
        }

        function toggleSidebar() {
            document.getElementById('mobileSidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        function renderFeed(container) {
            const posts = JSON.parse(localStorage.getItem('muse_posts') || '[]');
            const allPosts = [...posts, ...samplePosts].sort((a, b) => b.id - a.id);
            const filtered = currentCategory === 'all' ? allPosts : allPosts.filter(p => p.category === currentCategory);

            let html = '<div class="categories">';
            const cats = [
                { id: 'all', name: 'Всё' },
                { id: 'photo', name: 'Фото' },
                { id: 'art', name: 'Живопись' },
                { id: 'music', name: 'Музыка' },
                { id: 'text', name: 'Тексты' }
            ];
            cats.forEach(cat => {
                html += `<div class="category-chip ${currentCategory === cat.id ? 'active' : ''}" onclick="filterCategory('${cat.id}')">${cat.name}</div>`;
            });
            html += '</div>';

            if (filtered.length === 0) {
                html += '<div class="empty-state"><p>Пока нет постов в этой категории</p></div>';
            } else {
                html += filtered.map(post => renderPostCard(post)).join('');
            }

            container.innerHTML = html;
        }

        function renderPostCard(post) {
            let mediaHtml = '';
            if (post.type === 'image' && post.image) mediaHtml = `<img src="${post.image}" class="post-image">`;
            else if (post.type === 'audio') mediaHtml = '<div class="post-audio"><div class="audio-player"><button class="play-btn">▶</button><div>Аудио трек</div></div></div>';
            else if (post.type === 'text' && post.text) mediaHtml = `<div class="post-text">${post.text}</div>`;

            const comments = getCommentsForPost(post.id);
            const commentsCount = comments.length;

            return `<div class="post-card">
                <div class="post-header">
                    <div class="post-avatar">${post.avatar}</div>
                    <div class="post-author-info">
                        <div class="post-author-name">${post.author}</div>
                        <div class="post-author-handle">${post.handle}</div>
                    </div>
                </div>
                ${mediaHtml}
                <div class="post-content">
                    <div class="post-caption">${post.caption}</div>
                    <div class="post-tags">${post.tags.map(t => `<span class="tag">#${t}</span>`).join('')}</div>
                </div>
                <div class="post-actions">
                    <button class="action-btn ${post.liked ? 'liked' : ''}" onclick="toggleLike(${post.id})">
                        <svg fill="${post.liked ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                        <span>${post.likes}</span>
                    </button>
                    <button class="action-btn" onclick="toggleComments(${post.id})">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                        <span>${commentsCount}</span>
                    </button>
                </div>
                <div class="comments-section" id="comments-${post.id}" style="display: none;">
                    <div id="comments-list-${post.id}">
                        ${comments.map(c => renderComment(c, post.id)).join('')}
                    </div>
                    <div class="reply-indicator" id="reply-indicator-${post.id}">
                        <span>Ответ ${replyTo && replyTo.postId === post.id ? '@' + replyTo.author : ''}</span>
                        <button class="cancel-reply" onclick="cancelReply(${post.id})">×</button>
                    </div>
                    <div class="comment-input-wrapper">
                        <div class="comment-input-container">
                            <input type="text" class="comment-input" id="comment-input-${post.id}" placeholder="Написать комментарий...">
                            <button class="attach-image-btn" onclick="document.getElementById('comment-file-${post.id}').click()">📷</button>
                            <input type="file" id="comment-file-${post.id}" accept="image/*" style="display: none" onchange="handleCommentImage(event, ${post.id})">
                            <div class="comment-image-preview" id="comment-image-preview-${post.id}">
                                <img id="comment-image-thumb-${post.id}" src="">
                                <button class="remove-image-btn" onclick="removeCommentImage(${post.id})">×</button>
                            </div>
                        </div>
                        <button class="comment-submit" onclick="addComment(${post.id})">Отправить</button>
                    </div>
                </div>
            </div>`;
        }

        function renderComment(comment, postId) {
            const replies = getCommentsForPost(postId).filter(c => c.replyTo === comment.id);
            
            let html = `
                <div class="comment" id="comment-${comment.id}">
                    <div class="comment-avatar">${comment.avatar}</div>
                    <div class="comment-content">
                        <div class="comment-header">
                            <span class="comment-author">${comment.author}</span>
                            ${comment.replyTo ? `<span class="comment-reply-to">→ ${comment.replyToAuthor}</span>` : ''}
                        </div>
                        <div class="comment-text">${comment.text}</div>
                        ${comment.image ? `<img src="${comment.image}" class="comment-image" onclick="window.open('${comment.image}', '_blank')">` : ''}
                        <div class="comment-actions">
                            <button class="comment-action-btn" onclick="startReply(${postId}, '${comment.author}', ${comment.id})">Ответить</button>
                        </div>
                    </div>
                </div>
            `;

            replies.forEach(reply => {
                html += `
                    <div class="comment reply" id="comment-${reply.id}">
                        <div class="comment-avatar">${reply.avatar}</div>
                        <div class="comment-content">
                            <div class="comment-header">
                                <span class="comment-author">${reply.author}</span>
                                <span class="comment-reply-to">→ ${reply.replyToAuthor}</span>
                            </div>
                            <div class="comment-text">${reply.text}</div>
                            ${reply.image ? `<img src="${reply.image}" class="comment-image" onclick="window.open('${reply.image}', '_blank')">` : ''}
                            <div class="comment-actions">
                                <button class="comment-action-btn" onclick="startReply(${postId}, '${reply.author}', ${reply.id})">Ответить</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            return html;
        }

        function getCommentsForPost(postId) {
            const posts = JSON.parse(localStorage.getItem('muse_posts') || '[]');
            const post = posts.find(p => p.id === postId);
            if (post) return post.comments || [];
            
            // Sample posts comments
            const sampleComments = JSON.parse(localStorage.getItem('muse_sample_comments') || '{}');
            return sampleComments[postId] || [];
        }

        function toggleComments(postId) {
            const section = document.getElementById(`comments-${postId}`);
            if (section) {
                section.style.display = section.style.display === 'none' ? 'block' : 'none';
            }
        }

        function startReply(postId, authorName, commentId) {
            replyTo = { postId, author: authorName, commentId };
            const indicator = document.getElementById(`reply-indicator-${postId}`);
            if (indicator) {
                indicator.classList.add('active');
                indicator.querySelector('span').textContent = `Ответ @${authorName}`;
            }
            const input = document.getElementById(`comment-input-${postId}`);
            if (input) input.focus();
        }

        function cancelReply(postId) {
            replyTo = null;
            const indicator = document.getElementById(`reply-indicator-${postId}`);
            if (indicator) indicator.classList.remove('active');
        }

        function handleCommentImage(event, postId) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxSize = 600;
                    let width = img.width, height = img.height;
                    if (width > height && width > maxSize) { height = (height * maxSize) / width; width = maxSize; }
                    else if (height > maxSize) { width = (width * maxSize) / height; height = maxSize; }
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    commentImage = canvas.toDataURL('image/jpeg', 0.8);
                    
                    const preview = document.getElementById(`comment-image-preview-${postId}`);
                    const thumb = document.getElementById(`comment-image-thumb-${postId}`);
                    if (preview && thumb) {
                        thumb.src = commentImage;
                        preview.style.display = 'block';
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function removeCommentImage(postId) {
            commentImage = null;
            const preview = document.getElementById(`comment-image-preview-${postId}`);
            const fileInput = document.getElementById(`comment-file-${postId}`);
            if (preview) preview.style.display = 'none';
            if (fileInput) fileInput.value = '';
        }

        function addComment(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if (!text && !commentImage) return;

            const comment = {
                id: Date.now(),
                author: currentUser.name,
                avatar: currentUser.avatar,
                text: text || '[изображение]',
                time: Date.now(),
                image: commentImage || null,
                replyTo: replyTo && replyTo.postId === postId ? replyTo.commentId : null,
                replyToAuthor: replyTo && replyTo.postId === postId ? replyTo.author : null
            };

            const posts = JSON.parse(localStorage.getItem('muse_posts') || '[]');
            const post = posts.find(p => p.id === postId);
            
            if (post) {
                if (!post.comments) post.comments = [];
                post.comments.push(comment);
                localStorage.setItem('muse_posts', JSON.stringify(posts));
            } else {
                let sampleComments = JSON.parse(localStorage.getItem('muse_sample_comments') || '{}');
                if (!sampleComments[postId]) sampleComments[postId] = [];
                sampleComments[postId].push(comment);
                localStorage.setItem('muse_sample_comments', JSON.stringify(sampleComments));
            }

            input.value = '';
            removeCommentImage(postId);
            cancelReply(postId);
            renderFeed(document.getElementById('mainContent'));
            
            setTimeout(() => {
                const section = document.getElementById(`comments-${postId}`);
                if (section) section.style.display = 'block';
            }, 50);
        }

        function filterCategory(cat) {
            currentCategory = cat;
            renderFeed(document.getElementById('mainContent'));
        }

        function renderExplore(container) {
            const users = JSON.parse(localStorage.getItem('muse_users') || '[]');
            
            let html = '<div class="info-banner">📱 <b>Важно:</b> Сейчас вы видите только пользователей, зарегистрированных на этом устройстве. Чтобы видеть всех пользователей, нужен сервер (это сделает программист).</div>';
            
            html += '<h2 style="margin-bottom: 16px; font-size: 18px;">Пользователи Muse</h2>';
            
            if (users.length === 0) {
                html += '<div class="empty-state"><p>Пока никто не зарегистрировался</p></div>';
            } else {
                html += users.map(user => `
                    <div class="user-card">
                        <div class="user-card-avatar">${user.avatar}</div>
                        <div class="user-card-info">
                            <div class="user-card-name">${user.name}</div>
                            <div class="user-card-handle">${user.username}</div>
                        </div>
                    </div>
                `).join('');
            }

            container.innerHTML = html;
        }

        function renderProfile(container) {
            if (!currentUser) return;
            container.innerHTML = `
                <div class="profile-header">
                    <div class="profile-avatar">${currentUser.avatar}</div>
                    <div class="profile-name">${currentUser.name}</div>
                    <div class="profile-handle">${currentUser.username}</div>
                    <button class="edit-profile-btn" onclick="openEditModal()">Редактировать</button>
                    <button class="logout-btn" onclick="logout()">Выйти</button>
                </div>
                <div class="post-card"><p style="color: #666; text-align: center; padding: 20px;">У вас пока нет публикаций</p></div>
            `;
        }

        function openEditModal() {
            document.getElementById('editName').value = currentUser.name;
            document.getElementById('editUsername').value = currentUser.username;
            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        function saveProfile() {
            const newName = document.getElementById('editName').value.trim();
            const newUsername = document.getElementById('editUsername').value.trim();
            if (!newName || !newUsername) { alert('Заполните все поля'); return; }
            currentUser.name = newName;
            currentUser.username = newUsername;
            currentUser.avatar = newName.charAt(0).toUpperCase();
            localStorage.setItem('muse_currentUser', JSON.stringify(currentUser));
            const users = JSON.parse(localStorage.getItem('muse_users') || '[]');
            const index = users.findIndex(u => u.id === currentUser.id);
            if (index !== -1) { users[index] = currentUser; localStorage.setItem('muse_users', JSON.stringify(users)); }
            closeEditModal();
            renderProfile(document.getElementById('mainContent'));
            alert('Профиль обновлен!');
        }

        function toggleLike(postId) {
            const posts = JSON.parse(localStorage.getItem('muse_posts') || '[]');
            const post = posts.find(p => p.id === postId);
            if (post) {
                post.liked = !post.liked;
                post.likes += post.liked ? 1 : -1;
                localStorage.setItem('muse_posts', JSON.stringify(posts));
                renderFeed(document.getElementById('mainContent'));
            }
        }

        function openCreateModal() {
            document.getElementById('createModal').classList.add('active');
        }

        function closeCreateModal() {
            document.getElementById('createModal').classList.remove('active');
            resetForm();
        }

        function selectPostType(type) {
            currentPostType = type;
            document.querySelectorAll('.type-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.type === type));
            const uploadSection = document.getElementById('upload-section');
            const textSection = document.getElementById('text-section');
            const uploadArea = document.getElementById('upload-area');
            const fileInput = document.getElementById('file-input');

            if (type === 'image') {
                uploadSection.style.display = 'block';
                textSection.style.display = 'none';
                uploadArea.innerHTML = '<div class="upload-icon">📷</div><div class="upload-text">Нажмите, чтобы загрузить</div>';
                uploadArea.classList.remove('has-media');
                fileInput.accept = 'image/*';
            } else if (type === 'audio') {
                uploadSection.style.display = 'block';
                textSection.style.display = 'none';
                uploadArea.innerHTML = '<div class="upload-icon">🎵</div><div class="upload-text">Нажмите, чтобы загрузить аудио</div>';
                uploadArea.classList.remove('has-media');
                fileInput.accept = 'audio/*';
            } else {
                uploadSection.style.display = 'none';
                textSection.style.display = 'block';
            }
            updateSubmitButton();
        }

        function updateSubmitButton() {
            const submitBtn = document.getElementById('submit-btn');
            if (currentPostType === 'text') {
                submitBtn.disabled = !document.getElementById('text-content').value.trim();
            } else {
                submitBtn.disabled = !uploadedMedia;
            }
        }

        function resetForm() {
            document.getElementById('caption').value = '';
            document.getElementById('tags').value = '';
            document.getElementById('text-content').value = '';
            document.getElementById('file-input').value = '';
            const uploadArea = document.getElementById('upload-area');
            uploadArea.innerHTML = '<div class="upload-icon">📷</div><div class="upload-text">Нажмите, чтобы загрузить</div>';
            uploadArea.classList.remove('has-media');
            uploadedMedia = null;
            selectPostType('image');
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                if (currentPostType === 'image') {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const maxSize = 1200;
                        let width = img.width, height = img.height;
                        if (width > height && width > maxSize) { height = (height * maxSize) / width; width = maxSize; }
                        else if (height > maxSize) { width = (width * maxSize) / height; height = maxSize; }
                        canvas.width = width; canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        uploadedMedia = canvas.toDataURL('image/jpeg', 0.85);
                        const uploadArea = document.getElementById('upload-area');
                        uploadArea.innerHTML = `<img src="${uploadedMedia}">`;
                        uploadArea.classList.add('has-media');
                        updateSubmitButton();
                    };
                    img.src = e.target.result;
                } else if (currentPostType === 'audio') {
                    uploadedMedia = e.target.result;
                    const uploadArea = document.getElementById('upload-area');
                    uploadArea.innerHTML = `<div class="upload-icon"></div><div class="upload-text">${file.name}</div>`;
                    uploadArea.classList.add('has-media');
                    updateSubmitButton();
                }
            };
            reader.readAsDataURL(file);
        }

        function submitPost() {
            const caption = document.getElementById('caption').value.trim();
            const tagsStr = document.getElementById('tags').value.trim();
            const tags = tagsStr ? tagsStr.split(',').map(t => t.trim()).filter(t => t) : [];

            let newPost = {
                id: Date.now(),
                author: currentUser.name,
                handle: currentUser.username,
                avatar: currentUser.avatar,
                time: 'только что',
                type: currentPostType,
                caption: caption || 'Без подписи',
                tags, likes: 0, liked: false, comments: []
            };

            if (currentPostType === 'image') {
                if (!uploadedMedia) { alert('Загрузите изображение'); return; }
                newPost.image = uploadedMedia;
                newPost.category = 'photo';
            } else if (currentPostType === 'audio') {
                if (!uploadedMedia) { alert('Загрузите аудио'); return; }
                newPost.audio = uploadedMedia;
                newPost.category = 'music';
            } else {
                const text = document.getElementById('text-content').value.trim();
                if (!text) { alert('Напишите текст'); return; }
                newPost.text = text;
                newPost.category = 'text';
            }

            const posts = JSON.parse(localStorage.getItem('muse_posts') || '[]');
            posts.unshift(newPost);
            localStorage.setItem('muse_posts', JSON.stringify(posts));
            closeCreateModal();
            navigate('home');
        }

        document.getElementById('caption').addEventListener('input', updateSubmitButton);
        document.getElementById('text-content').addEventListener('input', updateSubmitButton);

        document.getElementById('createModal').addEventListener('click', function(e) {
            if (e.target === this) closeCreateModal();
        });

        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) closeEditModal();
        });
    </script>
</body>
</html>
